<header class="page-header">
  <div>
    @if (eyebrow()) {
    <p class="eyebrow">{{ eyebrow() }}</p>
    }
    <h1>{{ title() }}</h1>
    @if (subhead()) {
    <p class="subhead">{{ subhead() }}</p>
    }
  </div>
  <div class="header-actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
