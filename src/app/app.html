<mat-sidenav-container class="app-shell">
  <mat-sidenav opened mode="side" class="sidebar">
    <div class="brand">
      <span>Board</span>
    </div>

    <mat-nav-list>
      @for (item of nav; track item.path) {
      <a mat-list-item [routerLink]="item.path" routerLinkActive="active"
        [routerLinkActiveOptions]="item.path === '/dashboard' ? { exact: true } : { exact: false }">
        {{ item.label }}
      </a>
      }
    </mat-nav-list>

    <div class="sidebar__footer">
      <p>Angular 21</p>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main">
    <!-- <mat-toolbar>
      <div>
        <h2>Frontend Dashboard</h2>
      </div>
    </mat-toolbar> -->

    <section class="content">
      <router-outlet />
    </section>
  </mat-sidenav-content>
</mat-sidenav-container>
