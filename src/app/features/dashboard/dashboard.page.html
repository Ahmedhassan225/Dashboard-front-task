<section class="dashboard">
  <app-page-header
    eyebrow="Overview"
    title="Project Dashboard"
    subhead="Track your workload, progress, and team activity."
  ></app-page-header>

  <section class="stats-grid">
    <mat-card class="stat-card">
      <mat-card-header>
        <mat-card-title>{{ stats().total }}</mat-card-title>
        <mat-card-subtitle>Total Tasks</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions>
        <span class="badge">All statuses</span>
      </mat-card-actions>
    </mat-card>
    <mat-card class="stat-card accent">
      <mat-card-header>
        <mat-card-title>{{ stats().todo }}</mat-card-title>
        <mat-card-subtitle>Todo</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions>
        <span class="badge">Planned work</span>
      </mat-card-actions>
    </mat-card>
    <mat-card class="stat-card warm">
      <mat-card-header>
        <mat-card-title>{{ stats().inProgress }}</mat-card-title>
        <mat-card-subtitle>In Progress</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions>
        <span class="badge">Active tasks</span>
      </mat-card-actions>
    </mat-card>
    <mat-card class="stat-card success">
      <mat-card-header>
        <mat-card-title>{{ stats().done }}</mat-card-title>
        <mat-card-subtitle>Done</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions>
        <span class="badge">Completed</span>
      </mat-card-actions>
    </mat-card>
  </section>

  <section class="charts-grid">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Tasks by status</mat-card-title>
        <mat-card-subtitle>Live status mix from your board.</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="chart">
        <canvas
          baseChart
          [data]="statusChartData()"
          [type]="'doughnut'"
          [options]="doughnutOptions"
        ></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Tasks created this week</mat-card-title>
        <mat-card-subtitle>Signals drive immediate updates.</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="chart">
        <canvas
          baseChart
          [data]="trendChartData()"
          [type]="'line'"
          [options]="lineOptions"
        ></canvas>
      </mat-card-content>
    </mat-card>
  </section>
</section>
