<h2 mat-dialog-title>Export Tasks</h2>
<mat-dialog-content>
  <mat-form-field>
    <mat-label>Export Format</mat-label>
    <mat-select [(ngModel)]="selectedFormat">
      @for (format of availableFormats; track format) {
      <mat-option [value]="format">{{ format }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="export()">Export</button>
</mat-dialog-actions>
