<section class="tasks">
  <app-page-header eyebrow="Tasks" title="Kanban Board" subhead="Drag tasks between columns or create new ones.">
    <button actions mat-stroked-button type="button" (click)="openExportDialog()">Export</button>
    <button actions mat-flat-button color="primary" type="button" (click)="openCreate()">Add Task</button>
  </app-page-header>

  <section class="board" cdkDropListGroup>
    @for (column of columns(); track column.id) {
    <mat-card class="column-card">
      <mat-card-header>
        <mat-card-title>{{ column.title }}</mat-card-title>
        <mat-card-subtitle>{{ column.tasks.length }} tasks</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="dropzone" cdkDropList [id]="column.id" [cdkDropListData]="column.tasks"
        [cdkDropListEnterPredicate]="canEnter" (cdkDropListDropped)="drop($event)">
        @for (task of column.tasks; track task.id) {
        <div class="drag-item" cdkDrag [cdkDragData]="task">
          <app-task-card [task]="task" (edit)="startEdit($event)" (remove)="deleteTask($event)"></app-task-card>
          <ng-template cdkDragPlaceholder>
            <div class="placeholder"></div>
          </ng-template>
        </div>
        }
      </mat-card-content>
    </mat-card>
    }
  </section>
</section>
